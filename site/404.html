<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — RTMS</title>
    <link rel="icon" type="image/x-icon" href="/RTMS/favicon.ico">
    <script>
        // Redirección inteligente de mayúsculas y minúsculas para GitHub Pages
        (function() {
            var pathname = window.location.pathname;
            // Si la ruta solicitada contiene /rtms en minúsculas, redirigir a /RTMS
            if (pathname.toLowerCase().indexOf('/rtms') === 0 && pathname.indexOf('/RTMS') !== 0) {
                var correctedPath = '/RTMS' + pathname.substring(5);
                window.location.replace(window.location.origin + correctedPath + window.location.search + window.location.hash);
                return;
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-cyan: #38bdf8;
            --accent-teal: #14b8a6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 540px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-teal));
            color: #040914;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-home:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/RTMS/isotype.svg" alt="RTMS Logo" class="logo" onerror="this.style.display='none'">
        <h1>404 — Página no encontrada</h1>
        <p>La dirección solicitada no existe o ha sido reubicada. Puedes regresar al portal oficial de RTMS para acceder a las descargas y documentación técnica.</p>
        <a href="https://fjyarsky.github.io/RTMS/" class="btn-home">Ir al Inicio de RTMS</a>
    </div>
</body>
</html>
