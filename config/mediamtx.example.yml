# ==============================================================================
# RTMS — MediaMTX Broadcast Server Configuration (Template)
# ==============================================================================

# Control de buffer y encolamiento para latencia minima
writeQueueSize: 256
udpMaxPayloadSize: 1472

# API interna de telemetria y control de rutas
api: yes
apiAddress: 127.0.0.1:9997

# Desactivar protocolos no utilizados para optimizar CPU y puertos
rtsp: no
rtmp: no
hls: no

# Servidor SRT central (Multiplexacion mediante streamid)
srt: yes
srtAddress: :8890

# Servidor WebRTC / WHEP para vistas previas de baja latencia
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcLocalUDPAddress: :8189
webrtcAllowOrigin: "*"

# Configuracion de rutas (paths)
paths:
  all_others:
    overridePublisher: yes
