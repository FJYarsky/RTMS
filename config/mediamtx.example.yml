# ==============================================================================
# RTMS — MediaMTX Broadcast Server Configuration (Template)
# ==============================================================================

# Control de buffer y encolamiento para latencia minima (v2.8.2)
writeQueueSize: 128
udpMaxPayloadSize: 1472

# API interna de telemetria y control de rutas
api: yes
apiAddress: 127.0.0.1:9997

# Desactivar protocolos no utilizados para optimizar CPU y puertos
rtsp: no
rtmp: no
hls: no

# Servidor SRT central (Multiplexacion mediante streamid)
srt: yes
srtAddress: :8890

# Servidor WebRTC / WHEP para vistas previas de baja latencia (v2.8.2)
webrtc: yes
webrtcAddress: :8889
webrtcAdditionalHosts: ["127.0.0.1"]
webrtcEncryption: no
webrtcLocalUDPAddress: :8189
webrtcAllowOrigin: "*"

# Configuracion de rutas (paths)
paths:
  all_others:
    overridePublisher: yes
