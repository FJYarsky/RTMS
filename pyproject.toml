[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtms"
version = "2.5.0"
description = "Servidor multicámara de ultra-baja latencia para Windows vía SRT y MediaMTX"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Joaquín Yarsky", email = "joaquinyarsky@gmail.com" }
]
license = { text = "MIT" }
keywords = ["streaming", "srt", "mediamtx", "webrtc", "multicam", "ffmpeg", "directshow", "obs", "vmix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.2",
    "starlette>=0.38.0",
    "jinja2>=3.1.4",
    "pywebview>=5.1",
    "pystray>=0.19.5",
    "pillow>=10.4.0",
    "psutil>=6.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=2.3.1",
    "pyinstaller>=6.10.0",
]

[project.urls]
Homepage = "https://github.com/FJYarsky/RTMS"
Repository = "https://github.com/FJYarsky/RTMS"
Issues = "https://github.com/FJYarsky/RTMS/issues"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "gui"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "bin",
    ".git",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    "tmp"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E402", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
