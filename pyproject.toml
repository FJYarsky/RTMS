# RTMS v2.2.1 project metadata and build configuration
[project]
name = "rtms"
version = "2.2.1"
description = "Servidor multicámara de baja latencia para Windows vía SRT y UDP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Joaquín Yarsky", email = "joaquinyarsky@gmail.com" }
]
license = { text = "MIT" }
keywords = ["streaming", "srt", "multicam", "ffmpeg", "directshow", "obs", "vmix"]

[project.urls]
Homepage = "https://github.com/FJYarsky/RTMS"
Repository = "https://github.com/FJYarsky/RTMS"
Issues = "https://github.com/FJYarsky/RTMS/issues"

[tool.ruff]
line-length = 120
exclude = [
    "bin",
    ".git",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
