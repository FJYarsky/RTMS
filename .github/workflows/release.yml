# RTMS — Pipeline de empaquetado y publicación de releases oficiales
name: RTMS Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download Multimedia Binaries
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup_binaries.ps1

      - name: Build Portable Executable
        shell: cmd
        run: |
          call build_portable.bat

      - name: Create Release Archive
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "RTMS-${version}-Windows-x64.zip"
          Compress-Archive -Path "dist\rtms\*" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName"

      - name: Extract Release Notes for Tag
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $content = Get-Content RELEASE_NOTES.md -Raw -Encoding utf8
          $escapedTag = [regex]::Escape($tag)
          $pattern = "(?s)## RTMS ${escapedTag}\b.*?(?=\r?\n## RTMS v|\Z)"
          if ($content -match $pattern) {
              $cleanNotes = $matches[0].Trim()
              $cleanNotes | Set-Content -Path current_release_notes.md -Encoding utf8
              $titleLine = ($cleanNotes -split "`r?`n")[0] -replace "^##\s*", ""
              "RELEASE_NAME=$titleLine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Extracted release notes and title for $tag`: $titleLine"
          } elseif (Test-Path LATEST_RELEASE.md) {
              Copy-Item LATEST_RELEASE.md current_release_notes.md
              $firstLine = (Get-Content LATEST_RELEASE.md -Encoding utf8 | Select-Object -First 1) -replace "^#\s*", ""
              "RELEASE_NAME=$firstLine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Fallback to LATEST_RELEASE.md with title: $firstLine"
          } else {
              Copy-Item RELEASE_NOTES.md current_release_notes.md
              "RELEASE_NAME=RTMS $tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Fallback to full RELEASE_NOTES.md"
          }

      - name: VirusTotal Analysis
        id: virustotal
        uses: crazy-max/ghaction-virustotal@v5
        if: env.VT_API_KEY != ''
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            RTMS-*-Windows-x64.zip
          request_rate: 4

      - name: Append VirusTotal Results to Release Notes
        if: steps.virustotal.outcome == 'success' && steps.virustotal.outputs.analysis != ''
        shell: python
        run: |
          import os

          vt_raw = """${{ steps.virustotal.outputs.analysis }}""".strip()
          lines = []
          for entry in vt_raw.splitlines():
              entry = entry.strip()
              if not entry:
                  continue
              if "=" in entry:
                  fname, url = entry.split("=", 1)
                  lines.append(f"- **{fname.strip()}**: [Ver reporte completo en VirusTotal]({url.strip()})")
              else:
                  lines.append(f"- {entry}")

          items_md = "\n".join(lines)
          report = f"\n\n---\n### \U0001f6e1\ufe0f Verificaci\u00f3n de Seguridad e Integridad (VirusTotal)\nEl binario oficial de esta distribuci\u00f3n fue analizado y validado contra m\u00faltiples motores antivirus:\n\n{items_md}\n"

          with open("current_release_notes.md", "a", encoding="utf-8") as f:
              f.write(report)
          print("VirusTotal analysis appended to release notes successfully.")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME || format('RTMS {0}', github.ref_name) }}
          body_path: current_release_notes.md
          files: RTMS-*-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Update SECURITY.md Supported Version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          git fetch origin main
          git checkout main
          python -c "import re, sys; tag = sys.argv[1].lstrip('v'); p = 'SECURITY.md'; c = open(p, encoding='utf-8').read(); c = re.sub(r'\|\s*>=\s*[\d\.]+\s*\|\s*:white_check_mark:\s*\|', f'| >= {tag} | :white_check_mark: |', c); c = re.sub(r'\|\s*<\s*[\d\.]+\s*\|\s*:x:\s*\|', f'| < {tag} | :x: |', c); open(p, 'w', encoding='utf-8', newline='\n').write(c)" $tag
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/manage_descriptions.py --commit SECURITY.md -m "Detalle: soporte oficial desde $tag tras release oficial."
          git push origin main

