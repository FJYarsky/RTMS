# RTMS — Pipeline de integración continua y validación automatizada
name: RTMS CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download Multimedia Binaries
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup_binaries.ps1

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=core --cov=api --cov-report=term-missing

  build-check:
    name: PyInstaller Packaging Verification
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download Multimedia Binaries
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup_binaries.ps1

      - name: Run Build Portable
        shell: cmd
        run: |
          call build_portable.bat

      - name: Verify Distribution Artifacts
        shell: powershell
        run: |
          if (-not (Test-Path "dist/rtms/rtms.exe")) {
            throw "El ejecutable dist/rtms/rtms.exe no fue generado."
          }
          if (-not (Test-Path "dist/rtms/bin/ffmpeg.exe")) {
            throw "ffmpeg.exe no esta presente en dist/rtms/bin."
          }
          if (-not (Test-Path "dist/rtms/bin/ffplay.exe")) {
            throw "ffplay.exe no esta presente en dist/rtms/bin."
          }
          Write-Host "Verificacion de empaquetado completada exitosamente." -ForegroundColor Green
 
