# RTMS — Pipeline de integración continua y validación automatizada
name: RTMS CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "site/**"
      - "*.md"
      - "docs/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "site/**"
      - "*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements-dev.txt

      - name: Download Multimedia Binaries
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup_binaries.ps1

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Type Checking (Mypy)
        run: |
          mypy core api

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=core --cov=api --cov-report=term-missing

  build-check:
    name: PyInstaller Packaging Verification
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements-dev.txt

      - name: Download Multimedia Binaries
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup_binaries.ps1

      - name: Run Build Portable
        shell: cmd
        run: |
          call build_portable.bat

      - name: Verify Distribution Artifacts
        shell: powershell
        run: |
          $requiredFiles = @(
            "dist/rtms/rtms.exe",
            "dist/rtms/bin/ffmpeg.exe",
            "dist/rtms/bin/ffplay.exe",
            "dist/rtms/bin/mediamtx.exe",
            "dist/rtms/config/mediamtx.example.yml",
            "dist/rtms/config/config.example.json",
            "dist/rtms/THIRD_PARTY_NOTICES.md",
            "dist/rtms/icon.ico"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Artefacto obligatorio ausente en distribucion: $file"
            }
          }

          $templateFound = (Test-Path "dist/rtms/gui/templates/index.html") -or (Test-Path "dist/rtms/_internal/gui/templates/index.html")
          if (-not $templateFound) {
            throw "Plantilla web index.html no encontrada en la distribucion."
          }

          $jsFound = (Test-Path "dist/rtms/gui/static/app.js") -or (Test-Path "dist/rtms/_internal/gui/static/app.js")
          if (-not $jsFound) {
            throw "Script de aplicacion app.js no encontrado en la distribucion."
          }

          $i18nFound = (Test-Path "dist/rtms/gui/static/i18n.js") -or (Test-Path "dist/rtms/_internal/gui/static/i18n.js")
          if (-not $i18nFound) {
            throw "Diccionario de internacionalizacion i18n.js no encontrado en la distribucion."
          }

          $cssFound = (Test-Path "dist/rtms/gui/static/styles.css") -or (Test-Path "dist/rtms/_internal/gui/static/styles.css")
          if (-not $cssFound) {
            throw "Hoja de estilos styles.css no encontrada en la distribucion."
          }

          $malvinasFound = (Test-Path "dist/rtms/gui/static/malvinas.svg") -or (Test-Path "dist/rtms/_internal/gui/static/malvinas.svg")
          if (-not $malvinasFound) {
            throw "Vector oficial de Islas Malvinas no encontrado en la distribucion."
          }

          Write-Host "Verificacion de empaquetado y distribucion completada exitosamente." -ForegroundColor Green


 
